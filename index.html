const CHAPTERS = [["27 September", "The Day Our Story Began", "27 September", "Some dates quietly become part of your heart. When we met, I had no idea that one ordinary day would eventually mean so much to me. There was no perfect introduction or dramatic scene. Just two people, a simple beginning, and a story that had not yet learned its own name.", "I would choose that beginning again.", "first-meet.jpg", ""], ["The First Conversations", "From Hello to Something Familiar", "", "We started talking, and somehow the little conversations became the ones I looked forward to most. A message, a laugh, an unexpected notification—each one made the distance between us feel smaller. We were getting to know each other without needing to rush.", "Some people make even ordinary conversations feel special.", "", ""], ["6 October", "The Garba Nights", "6 October", "Navratri gave us a memory I still smile about. Playing Garba with you was not just about the music or the steps. I was shy, and I was learning, but being beside you made the whole evening feel different. I loved seeing how happy Garba made you.", "The best part of the celebration was sharing it with you.", "garba.jpg", ""], ["9 October", "The Selfie I Still Remember", "9 October", "Then came the moment you asked for a selfie. Such a small request, yet it meant so much to me. It felt like a little sign that our friendship was becoming something truly ours. A photograph captured a second; my heart kept the feeling.", "One picture, a thousand reasons to smile.", "selfie.jpg", ""], ["After Goodnight", "Our Everyday Kind of Magic", "", "Somewhere between good morning and goodnight, we became part of each other’s routines. We shared stories, silly jokes, worries, and the kind of small details that do not sound important until they come from someone you care about.", "I did not need a special occasion to want to talk to you.", "", ""], ["The Best-Friend Era", "The Beautiful In-Between", "", "Before we called it love, we had a friendship I never want to forget. We could laugh at the smallest things and talk about the biggest ones. That stage mattered because it gave our feelings a place to grow, gently and naturally.", "I fell in love with the comfort of being your friend.", "", ""], ["26 December", "Your Birthday, My Favourite Celebration", "26 December", "Your birthday was about celebrating you, and somehow it became a beautiful memory for me too. The photographs, shopping together, choosing things, and spending time with you all felt special. I loved seeing your happiness, and I loved being part of it.", "Happy birthday, Sangitaa. I hope you always feel celebrated.", "birthday.jpg", ""], ["Our Movie Date", "A Screen Full of Stories", "", "We went to watch a movie, but what I remember most is the feeling of sharing the day with you. The plan, the excitement, the moments before and after—it was not just about the film. It was about us making another memory together.", "My favourite part of the movie date was my company. You.", "movie.jpg", ""], ["Shopping & Dinner", "Little Plans, Lovely Memories", "", "From shopping together to our time at Kake Di Hatti, even simple plans felt like adventures. I liked the way we could spend hours doing ordinary things and still have something to remember afterward.", "With you, the plan is never as important as the person.", "date.jpg", ""], ["GT vs PBKS", "A Match We Shared", "", "The GT vs PBKS match gave us another story to tell. A stadium, a game, and a day that belonged to our growing collection of memories. Not every moment was easy, but we learned that listening, speaking kindly, and understanding each other matter more than winning an argument.", "Our best team has always been the two of us.", "match.jpg", ""], ["The Words I Meant", "I Think I Like You", "", "There came a point when I could no longer pretend these were only ordinary feelings. I wanted to tell you, gently and sincerely, what had been growing in my heart: “I think I’m attached to you. I like you.” Those words were simple, but they were real.", "Some of the bravest words are also the quietest.", "", ""], ["27 November", "Understanding Without Rushing", "27 November", "What made that conversation precious was not a dramatic answer. It was the way we could be honest and still give each other room to understand. We did not have to force a label onto every feeling. We could let the story become what it was meant to be.", "Sometimes being understood is its own kind of love.", "", ""], ["Still Us", "Best Friends, With More Feelings", "", "We kept talking, laughing, meeting, and learning. Friendship did not disappear when feelings arrived; it became the foundation underneath them. I treasure that part of our journey because it reminds me how naturally you became important to me.", "I never want us to stop being best friends.", "", ""], ["Our Favourite Places", "The Places That Hold Our Memories", "", "Brothers Cafe, the garden, our pizza dates, a waterpark day, singing, dancing, travelling together—each place holds a different version of us. I do not need every moment to be perfect. I just love that we have so many moments to call ours.", "A place becomes a memory when you share it with the right person.", "memories.jpg", ""], ["The Small Gifts", "Things I Keep Close", "", "A ring, a handmade card, photographs, flowers, and the thoughtful things you have given me remind me how much love can fit inside something small. I want to appreciate not only the gifts but also the time, trust, and feeling behind them.", "The meaning of a gift is always bigger than its size.", "gifts.jpg", ""], ["Learning Together", "Love Is Also Understanding", "", "We have had misunderstandings and difficult conversations. I know I have not always chosen the right words, and I want to keep growing in patience and respect. I do not want our story to be about never disagreeing; I want it to be about listening better and caring for each other through it.", "Love grows when we choose kindness, especially on hard days.", "", ""], ["From Friends to Love", "My Girlfriend, My Best Friend", "", "Little by little, we became more than best friends. There was no single magical trick. There was time, care, trust, and the feeling that kept bringing us closer. And now, when I say you are my girlfriend, I still smile because I also get to call you my best friend.", "My favourite part of us is that we began with friendship.", "together.jpg", ""], ["The Little Things", "My Favourite Version of Everyday", "", "The messages, teasing, laughter, random photographs, songs, and quiet moments matter to me. I love the way a simple day can become memorable when you are part of it. I want us to keep making room for these small joys.", "Ordinary days are beautiful when they include you.", "", ""], ["A Letter to You", "Dear Sangitaa", "", "Thank you for being part of my life and for sharing so many moments with me. I admire your joy, your care, and the way you make ordinary memories feel worth saving. I am still learning how to love well, but I know I want to do it with honesty, warmth, and respect.", "I love you, Sangitaa. — Sumit", "", ""], ["Tomorrow & Beyond", "The Chapters We Have Not Written", "", "There are still movies we have not watched, songs we have not sung, places we have not visited, and photographs we have not taken. I cannot tell you exactly what every tomorrow will bring. But I hope we keep making memories and choosing to understand each other along the way.", "Our favourite chapter might still be ahead of us.", "", ""]];

function render(){if(mode==='story'){const total=CHAPTERS.length+customChapters.length+2;book.innerHTML=index===0?`<section class="page cover"><div class="eyebrow">A STORY WRITTEN BY TWO HEARTS</div><h1>Our Talk<br>Diaries</h1><div class="heart">❤️‍🩹</div><h2 style="color:#edca8b">Sumit & Sangitaa</h2><p>From 27 September to every tomorrow we haven't written yet.</p><button id="openBook" class="goldbtn">Open Our Book 📖</button></section>`:index===total-1?`<section class="page cover"><div class="eyebrow">THE END — FOR NOW</div><h1>To Be<br>Continued…</h1><div class="heart">♡</div><p>Every beautiful chapter is a reason to keep writing.</p><h2 style="color:#edca8b">Forever your best friend, Sumit</h2><button id="openDiary" class="goldbtn">Write our next chapter ✍️</button></section>`:chapterMarkup(index<=CHAPTERS.length?CHAPTERS[index-1]:customToArray(customChapters[index-CHAPTERS.length-1]),index-1);$('counter').textContent=`${index+1} / ${total}`;$('prevBtn').disabled=index===0;$('nextBtn').disabled=index===total-1;$('openBook')?.addEventListener('click',()=>{index=1;render()});$('openDiary')?.addEventListener('click',()=>switchMode('diary'));}else{ $('prevBtn').disabled=true;$('nextBtn').disabled=true;$('counter').textContent=mode==='diary'?'Our Diary':'Our Gallery';if(mode==='diary')requireAuth('diary');else if(mode==='editor')requireAuth('editor');else renderGallery();}}

function renderDiary(){book.innerHTML=`<section class="page"><div class="eyebrow">THE PAGES WE WRITE TOGETHER</div><h2>Our Shared Diary ✍️</h2><p>Leave a little note for each other. Saved entries sync across devices when both users are signed in and Supabase is configured.</p><div id="authPanel"><input class="field" id="email" type="email" placeholder="Your Supabase account email"><input class="field" id="authPass" type="password" placeholder="Account password"><button class="goldbtn" id="signIn">Sign in</button><button class="toolbtn" id="signUp">Create account</button><button class="toolbtn" id="signOut">Sign out</button></div><select class="field" id="author"><option>Sumit</option><option>Sangitaa</option></select><textarea class="field" id="note" placeholder="Dear you…"></textarea><button class="goldbtn" id="saveNote">Save this memory ♡</button><p class="notice" id="diaryMessage"></p><div id="entries"><div class="empty">Your next chapter begins here.</div></div></section>`;$('saveNote').onclick=saveNote;$('signIn').onclick=()=>auth('signInWithPassword');$('signUp').onclick=()=>auth('signUp');$('signOut').onclick=async()=>{if(supabase)await supabase.auth.signOut();verifiedUser=null;requireAuth(mode)};loadEntries()}

async function loadCustomChapters(){
 if(!supabase)return;
 const {data:{user}}=await supabase.auth.getUser();if(!user)return;
 const {data,error}=await supabase.from('couple_chapters').select('*').order('created_at',{ascending:true});
 if(!error){customChapters=data||[];if(mode==='story')render()}
}
function renderEditor(){
 book.innerHTML=`<section class="page"><div class="eyebrow">OUR NEXT PAGES</div><h2>Add & Edit Chapters ✍️</h2><p>Write a new chapter together. Your saved chapters appear after the original story, on both devices.</p><div class="chapter-actions"><button class="toolbtn" id="signOutEditor">Sign out</button><button class="toolbtn" id="reloadChapters">↻ Refresh</button></div><div id="chapterList"></div><h2 id="editorHeading" style="font-size:27px">New chapter</h2><input class="field" id="chapterDate" placeholder="Date / chapter label"><input class="field" id="chapterTitle" maxlength="120" placeholder="Chapter title"><input class="field" id="chapterSubtitle" maxlength="160" placeholder="Subtitle (optional)"><textarea class="field" id="chapterBody" maxlength="12000" placeholder="Write your story here..."></textarea><textarea class="field" id="chapterQuote" maxlength="500" placeholder="A little quote (optional)"></textarea><div class="chapter-actions"><button class="goldbtn" id="saveChapter">♡ Save chapter</button><button class="toolbtn" id="clearChapter">+ New chapter</button></div><p class="notice" id="chapterMessage"></p></section>`;
 $('saveChapter').onclick=saveChapter;$('clearChapter').onclick=()=>{editingChapterId=null;renderEditor()};
 $('reloadChapters').onclick=async()=>{await loadCustomChapters();renderEditor()};
 $('signOutEditor').onclick=async()=>{await supabase.auth.signOut();verifiedUser=null;authScreen('editor')};
 const list=$('chapterList');list.innerHTML=customChapters.length?customChapters.map((c,i)=>`<div class="entry"><b>${esc(c.title)}</b> <small>${esc(c.date_label||'')}</small><div class="chapter-actions"><button class="toolbtn" data-edit="${i}">Edit ✎</button><button class="toolbtn" data-read="${i}">Read 📖</button></div></div>`).join(''):'<p>No added chapters yet. Write your first new chapter below.</p>';
 list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const c=customChapters[Number(b.dataset.edit)];editingChapterId=c.id;$('chapterDate').value=c.date_label||'';$('chapterTitle').value=c.title;$('chapterSubtitle').value=c.subtitle||'';$('chapterBody').value=c.body;$('chapterQuote').value=c.quote||'';$('editorHeading').textContent='Editing: '+c.title;$('chapterTitle').focus()});
 list.querySelectorAll('[data-read]').forEach(b=>{b.onclick=()=>{mode='story';index=CHAPTERS.length+1+Number(b.dataset.read);render()}});
}
async function saveChapter(){
 const title=$('chapterTitle').value.trim(),body=$('chapterBody').value.trim();
 if(!title||!body){$('chapterMessage').textContent='Please enter a title and story.';return}
 const {data:{user}}=await supabase.auth.getUser();if(!user){authScreen('editor');return}
 const payload={title,body,date_label:$('chapterDate').value.trim(),subtitle:$('chapterSubtitle').value.trim(),quote:$('chapterQuote').value.trim()};
 $('saveChapter').disabled=true;
 let result=editingChapterId?await supabase.from('couple_chapters').update(payload).eq('id',editingChapterId):await supabase.from('couple_chapters').insert({...payload,user_id:user.id});
 $('saveChapter').disabled=false;
 if(result.error){$('chapterMessage').textContent='Could not save: '+result.error.message;return}
 editingChapterId=null;await loadCustomChapters();renderEditor();$('chapterMessage').textContent='Chapter saved and synced ❤️';
}
let touchX=0,touchY=0;
book.addEventListener('touchstart',e=>{if(mode!=='story'||e.touches.length!==1)return;touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',e=>{if(mode!=='story'||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.35)return;turnStory(dx<0?1:-1)},{passive:true});
book.addEventListener('click',e=>{if(mode!=='story'||e.target.closest('button,a,input,textarea,select,video,audio'))return;const r=book.getBoundingClientRect();if(e.clientX-r.left>r.width*.78)turnStory(1);else if(e.clientX-r.left<r.width*.22)turnStory(-1)});
function turnStory(dir){if(mode!=='story')return;const next=index+dir;if(next<0||next>CHAPTERS.length+customChapters.length+1)return;book.classList.remove('flip-next','flip-prev');void book.offsetWidth;book.classList.add(dir>0?'flip-next':'flip-prev');index=next;render()}
// Supabase auth sessions are required for private tools. Story remains behind the separate passcode.

const songSelect=$('songSelect');CONFIG.songs.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.title;songSelect.appendChild(o)});$('musicToggle').onclick=async()=>{const p=$('player');if(!p.paused){p.pause();$('musicToggle').textContent='♫ Play music';return}if(!p.src||p.src===location.href){songSelect.value='0';p.src=CONFIG.songs[0]?.src||''}try{await p.play();$('musicToggle').textContent='♫ Pause music'}catch(e){$('status').textContent='Add your audio file in the media folder to play music.'}};songSelect.onchange=async()=>{const s=CONFIG.songs[Number(songSelect.value)];if(!s)return;$('player').src=s.src;try{await $('player').play();$('musicToggle').textContent='♫ Pause music'}catch(e){$('status').textContent='Song file not found or browser blocked playback.'}};
function unlock(){if($('passInput').value!==CONFIG.sharedPasscode){$('loginError').textContent='That password is not quite right ♡';return}$('loginModal').classList.add('hidden');sessionStorage.setItem('diaryUnlocked','yes')}$('unlockBtn').onclick=unlock;$('passInput').onkeydown=e=>{if(e.key==='Enter')unlock()};if(sessionStorage.getItem('diaryUnlocked')==='yes')$('loginModal').classList.add('hidden');render();connectDB();
</script></body></html>
